name: Matjakt DevOps
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && 'course-release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: App and database
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:start
      - run: pnpm run env:local
      - run: pnpm run verify
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm run test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: output/playwright
          if-no-files-found: ignore
      - run: pnpm run db:stop
        if: always()
  terraform_format:
    name: Terraform format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.2
      - run: terraform -chdir=infra fmt -check
  gate:
    name: CI gate
    runs-on: ubuntu-24.04
    needs: [verify, terraform_format]
    if: always()
    steps:
      - name: Require every check to pass
        env:
          APP_RESULT: ${{ needs.verify.result }}
          FORMAT_RESULT: ${{ needs.terraform_format.result }}
        run: test "$APP_RESULT" = success && test "$FORMAT_RESULT" = success
  deploy:
    name: Course release
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: course
    permissions:
      contents: read
      id-token: write
    env:
      COURSE_GCP_PROJECT_ID: ${{ vars.COURSE_GCP_PROJECT_ID }}
      COURSE_RUN_SERVICE: ${{ vars.COURSE_RUN_SERVICE }}
      COURSE_GCP_REGION: ${{ vars.COURSE_GCP_REGION }}
      COURSE_IMAGE_REPOSITORY: ${{ vars.COURSE_IMAGE_REPOSITORY }}
      COURSE_SUPABASE_PROJECT_REF: ${{ vars.COURSE_SUPABASE_PROJECT_REF }}
      VITE_SUPABASE_URL: ${{ vars.COURSE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ vars.COURSE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject an obsolete merge commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --input-type=module -e "import {courseEnvironment} from './scripts/course-guard.mjs'; courseEnvironment();"
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Apply course migrations
        env:
          COURSE_SUPABASE_DB_URL: ${{ secrets.COURSE_SUPABASE_DB_URL }}
        run: node scripts/migrate-course.mjs
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.COURSE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.COURSE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.COURSE_GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 586.0.0
      - run: gcloud auth configure-docker "$COURSE_GCP_REGION-docker.pkg.dev" --quiet
      - run: pnpm run deploy:course
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: course-release-${{ github.sha }}
          path: |
            output/deployment/release.json
            output/playwright
          if-no-files-found: ignore
