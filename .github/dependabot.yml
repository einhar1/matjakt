version: 2
updates:
  # GitHub uses the npm ecosystem for pnpm-lock.yaml as well.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra
    schedule: { interval: weekly }
